<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c110e">
<title>ZBS Kaynakları</title>
<link rel="icon" href="site/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site/stil.css?v=202611071816">
<style>
/* Kaynaklar: üstte sağlık özeti, sonra bölgelere göre gruplanmış açık renkli kaynak kartları */
.sayfa{max-width:1180px;margin:0 auto;padding:24px max(var(--kanat),env(safe-area-inset-right,0px)) 64px max(var(--kanat),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sayfa h1{margin:0;font-size:1.8rem;letter-spacing:-.01em}
.giris{margin:-8px 0 0;color:var(--soluk);max-width:72ch}
.saglik{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.saglik button{text-align:left;border:1px solid var(--cizgi);background:var(--yuzey);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.saglik button[aria-pressed="true"]{border-color:var(--ink2);background:var(--yuzey2)}
.saglik b{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.saglik span{font-size:.78rem;color:var(--soluk);display:flex;align-items:center;gap:6px}
.nokta{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-iyi{background:#3ccf82}.d-sessiz{background:#f2b84b}.d-kopuk{background:#ff5a5f}.d-yok{background:#6b7a72}
.arac{display:flex;flex-direction:column;gap:10px;position:sticky;top:var(--ust);background:var(--bg);padding:10px 0;z-index:5}
.grup h2{margin:14px 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk)}
.izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kk{background:var(--kart);color:var(--k-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.kk-ust{display:flex;align-items:center;gap:10px;min-width:0}
.kk-ad{font-weight:700;min-width:0}
.kk-ad a{color:var(--k-ink);text-decoration:none}
.kk-ad a:hover{text-decoration:underline}
.kk-yer{font-size:.76rem;color:var(--k-soluk)}
.kk p{margin:0;font-size:.9rem;color:var(--k-ink2)}
.kk .izleme{font-family:var(--mono);font-size:.72rem;color:var(--k-soluk)}
.kk .izleme .nokta{margin-right:6px;vertical-align:1px}
.kk .not{font-size:.8rem;color:var(--k-amber)}
@media (max-width:820px){.saglik{grid-template-columns:repeat(2,minmax(0,1fr))}.izgara{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="ust">
  <div class="ust-ic">
    <a class="marka" href="./" aria-label="ZBS ana sayfa"><img class="logo" src="site/logo.svg" alt="" width="32" height="32"><span class="marka-ad">ZBS</span></a>
    <p class="slogan">Kaynaklar</p>
    <nav class="menu"><a href="./">Akış</a><a href="arsiv.html">Arşiv</a></nav>
  </div>
</header>
<main class="sayfa">
  <h1>Kaynaklar</h1>
  <p class="giris">ZBS’nin izlediği yayın organları: nerede oldukları, kime ait oldukları ve hangi çizgide durdukları. Her haberi okurken kimin sesini duyduğunu bil diye. Kartlardaki renkli nokta, toplayıcının o kaynağı en son ne zaman okuyabildiğini gösterir.</p>
  <div class="saglik" id="saglik"></div>
  <div class="arac">
    <div class="ara-kutu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="ara" id="ara" type="search" placeholder="Ad, şehir ya da profil ara" aria-label="Ara"></div>
    <div class="bolgeler" id="bolgeler" role="group" aria-label="Bölge"></div>
  </div>
  <div id="liste"></div>
</main>
<script>
(function(){
  const REG=["Filistin","Meşrik","Körfez","Mısır","İran","Yemen","Mağrip","Anadolu-Türkiye","İsrail","ABD","İngiltere","İspanya","İtalya","Almanya","Fransa","Asya ve diğer"];
  const TUR={resmi:"devlet",grup:"bağlı",bagimsiz:"bağımsız",koop:"kooperatif",ozel:"özel",izle:"karşı taraf"};
  const DIL={ar:"Arapça",en:"İngilizce",fr:"Fransızca",tr:"Türkçe",he:"İbranice",es:"İspanyolca",ca:"Katalanca",it:"İtalyanca",de:"Almanca"};
  const YOL={harita:"haber site haritası",besleme:"RSS / Atom",wp:"WordPress",gnews:"Google Haberler araması (son çare)"};
  const DURUM={iyi:"Çalışıyor",sessiz:"Sessiz (6 saatten uzun)",kopuk:"Okunamıyor",yok:"Henüz denenmedi"};
  const BAYRAK='<svg viewBox="0 0 22 16" class="bayrak" role="img" aria-label="İsrail merkezli yayın"><title>İsrail merkezli yayın</title><rect x=".25" y=".25" width="21.5" height="15.5" rx="1.5" fill="#fff" stroke="#c9d1cc" stroke-width=".5"/><rect y="2" width="22" height="2.2" fill="#0038b8"/><rect y="11.8" width="22" height="2.2" fill="#0038b8"/><path d="M11 5.1l2.7 4.6H8.3zM11 10.9 8.3 6.3h5.4z" fill="none" stroke="#0038b8" stroke-width=".8"/></svg>';
  const $=(i)=>document.getElementById(i);
  const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
  const bas=(ad)=>{const k=ad.replace(/^(The|Al|El|La|Le|Il|L’|Der|Die)[\s-]+/i,"").replace(/[^\p{L}\p{N} ]/gu," ").trim().split(/\s+/);return((k[0]||"")[0]+((k[1]||"")[0]||(k[0]||"")[1]||"")).toUpperCase();};
  let K=[],D={},N={},bolge="Tümü",ara="",sDurum=null;
  function saglik(k){const d=D[String(k.id)]||{};if(!d.kesif)return"yok";if(!d.son_basari)return"kopuk";const s=(Date.now()-new Date(d.son_basari))/36e5;return s<6?"iyi":s<48?"sessiz":"kopuk";}
  function once(iso){const d=(Date.now()-new Date(iso))/6e4;if(d<60)return Math.max(1,Math.round(d))+" dk önce";if(d<1440)return Math.round(d/60)+" sa önce";return Math.round(d/1440)+" gün önce";}
  function ust(){
    const s=$("saglik");s.innerHTML="";
    Object.keys(DURUM).forEach(k=>{const b=el("button");b.type="button";b.setAttribute("aria-pressed",sDurum===k);
      b.appendChild(el("b",null,K.filter(x=>saglik(x)===k).length));const sp=el("span");const n=el("i","nokta d-"+k);sp.appendChild(n);sp.append(DURUM[k]);b.appendChild(sp);
      b.onclick=()=>{sDurum=sDurum===k?null:k;ciz();};s.appendChild(b);});
  }
  function ciz(){
    ust();
    document.querySelectorAll("#bolgeler .cip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===bolge));
    const L=$("liste");L.innerHTML="";
    const ok=k=>(bolge==="Tümü"||k.bolge===bolge)&&(!sDurum||saglik(k)===sDurum)&&(!ara||[k.ad,k.sehir,k.ulke,k.profil,k.url].join(" ").toLocaleLowerCase("tr").includes(ara));
    let n=0;
    REG.forEach(r=>{const ks=K.filter(k=>k.bolge===r&&ok(k));if(!ks.length)return;n+=ks.length;
      const g=el("section","grup");g.appendChild(el("h2",null,r+" · "+ks.length));const iz=el("div","izgara");
      ks.forEach(k=>{const c=el("article","kk"),u=el("div","kk-ust");
        u.appendChild(el("div","avatar "+k.tur,bas(k.ad)));const w=el("div");const ad=el("div","kk-ad");if(k.bolge==="İsrail")ad.insertAdjacentHTML("afterbegin",BAYRAK);
        const a=el("a",null,k.ad);a.href=k.url;a.target="_blank";a.rel="noopener";ad.appendChild(a);w.appendChild(ad);
        w.appendChild(el("div","kk-yer",k.sehir+", "+k.ulke+" · "+(DIL[k.dil]||k.dil)));u.appendChild(w);
        const rz=el("div","rozetler");rz.appendChild(el("span","rozet "+k.tur,TUR[k.tur]));u.appendChild(rz);c.appendChild(u);
        c.appendChild(el("p",null,k.profil));
        const d=D[String(k.id)]||{},sd=saglik(k);const iz2=el("div","izleme");iz2.appendChild(el("i","nokta d-"+sd));
        const yol=[];if(d.yontem&&YOL[d.yontem.tip])yol.push(YOL[d.yontem.tip]);if(d.telegram)yol.push("Telegram @"+d.telegram);
        iz2.append(DURUM[sd]+" · "+(yol.length?yol.join(" + "):"yol bulunamadı")+(d.son_basari?" · son okuma "+once(d.son_basari):"")+" · son 2 günde "+(N[k.id]||0)+" haber");
        c.appendChild(iz2);if(k.notu)c.appendChild(el("div","not",k.notu));iz.appendChild(c);});
      g.appendChild(iz);L.appendChild(g);});
    if(!n)L.appendChild(el("p","bos","Bu süzgeçle eşleşen kaynak yok."));
  }
  Promise.all([fetch("kaynaklar.json?t="+Date.now()).then(r=>r.json()),fetch("data/durum.json?t="+Date.now()).then(r=>r.json()).catch(()=>({})),fetch("data/haberler.json?t="+Date.now()).then(r=>r.json()).catch(()=>({haberler:[]}))])
  .then(([k,d,h])=>{K=k;D=d;(h.haberler||[]).forEach(x=>N[x.kaynak]=(N[x.kaynak]||0)+1);
    ["Tümü",...REG].forEach(r=>{const b=el("button","cip",r);b.type="button";b.dataset.k=r;b.onclick=()=>{bolge=r;ciz();};$("bolgeler").appendChild(b);});ciz();})
  .catch(()=>{$("liste").textContent="Kaynak listesi okunamadı.";});
  let t;$("ara").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{ara=e.target.value.trim().toLocaleLowerCase("tr");ciz();},150);});
})();
</script>
</body>
</html>
