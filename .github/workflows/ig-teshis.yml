name: Instagram teşhisi

# Elle çalıştırılır: Instagram jetonu ve Telegram onay kanalının durumunu log'a yazar (jeton yazılmaz).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python toplayici/ig_teshis.py
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_HESAP: ${{ vars.INSTAGRAM_HESAP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_YONETICI: ${{ secrets.TELEGRAM_YONETICI }}
