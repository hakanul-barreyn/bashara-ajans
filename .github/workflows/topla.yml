name: Haberleri topla

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dakikada bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri çek ve özetle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OZET_SINIRI: ${{ vars.OZET_SINIRI }}
        run: python toplayici/topla.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "zbs-toplayici"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Yeni haber yok"
            exit 0
          fi
          git commit -m "Haberler: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
