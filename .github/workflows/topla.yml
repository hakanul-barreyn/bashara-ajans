name: Haberleri topla

# Veri (data/) ana dalda değil, tek bir commit olarak tutulan "veri" dalında durur.
# Böylece her 15 dakikada bir yapılan güncelleme deponun geçmişini şişirmez.
# Site, kod ile güncel veri birleştirilerek GitHub Pages'e doğrudan yayımlanır.

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dakikada bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırmak için
  push:
    branches: [main]          # kod değişince siteyi hemen yenile

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Önceki veriyi al
        run: |
          mkdir -p data
          if git fetch --depth 1 origin veri 2>/dev/null; then
            git checkout FETCH_HEAD -- data && git reset -q
          else
            echo '{"guncellendi":null,"haberler":[]}' > data/haberler.json
            echo '{}' > data/durum.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri çek ve özetle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OZET_SINIRI: ${{ vars.OZET_SINIRI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL: ${{ vars.TELEGRAM_KANAL || secrets.TELEGRAM_KANAL }}
        run: python toplayici/topla.py

      - name: Veriyi kaydet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Önceki veri commit'inin üzerine tek bir commit olarak yaz; yalnızca değişen dosyalar gönderilir
          V="$RUNNER_TEMP/veri"; rm -rf "$V"
          ADRES="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch veri "$ADRES" "$V" 2>/dev/null; then YENI=0; else mkdir -p "$V" && git -C "$V" init -q -b veri && YENI=1; fi
          rm -rf "$V/data" && cp -r data "$V/"
          cd "$V"
          git add -A
          KIM=(-c user.name="zbs-toplayici" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          if [ "$YENI" = 1 ]; then git "${KIM[@]}" commit -q -m "Veri"; else git "${KIM[@]}" commit -q --amend -m "Veri: $(date -u +'%Y-%m-%d %H:%M') UTC"; fi
          git push -q -f "$ADRES" veri

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: yayin
        uses: actions/deploy-pages@v4
