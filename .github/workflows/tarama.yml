name: Geriye dönük tarama

# 7 Ekim 2023'ten toplayıcının başladığı güne kadar her yayının haber listesi (başlık, tarih, bağlantı).
# Saatte bir 45 dakika çalışır, kaldığı yerden devam eder. Veri ve durum "tarama" dalında durur; ana siteyi etkilemez.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      sadece_ozet:
        description: "Taramayı atla, yalnızca Almanak özetini yeniden yaz"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Önceki tarama durumunu al
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ADRES="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch tarama "$ADRES" tarama 2>/dev/null || (mkdir -p tarama && git -C tarama init -q -b tarama)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tara
        if: ${{ !inputs.sadece_ozet }}
        env:
          TARAMA_SURE: "2500"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_YONETICI: ${{ secrets.TELEGRAM_YONETICI }}
        run: python toplayici/tarama.py

      - name: Canlı toplayıcının günlük başlıkları (veri dalı)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ADRES="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$RUNNER_TEMP/v"
          if git clone -q --depth 1 --branch veri --filter=blob:none --sparse "$ADRES" "$RUNNER_TEMP/v" 2>/dev/null; then
            git -C "$RUNNER_TEMP/v" sparse-checkout set data/canli && echo "CANLI_KLASOR=$RUNNER_TEMP/v/data/canli" >> "$GITHUB_ENV"
          fi

      - name: Almanak için özet
        run: python toplayici/gecmis.py

      - name: Kaydet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tarama
          ADRES="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          KIM=(-c user.name="zbs-tarama" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          if git rev-parse -q --verify HEAD >/dev/null; then git "${KIM[@]}" commit -q --amend -m "Tarama: $(date -u +'%Y-%m-%d %H:%M') UTC"; else git "${KIM[@]}" commit -q -m "Tarama"; fi
          git push -q -f "$ADRES" HEAD:tarama
